; Process table for the all-in-one backend container.
;
; `priority` only sets start ORDER, not readiness — supervisor fires the next
; program the moment the previous one is spawned. The API and worker wrappers
; therefore block on their own dependency checks before exec'ing the real
; process; see start-api.sh / start-worker.sh.
;
; Every program logs to the container's stdout/stderr so `docker compose logs`
; shows the whole backend in one stream.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; --------------------------------------------------------------------------
; Backing services
; --------------------------------------------------------------------------

[program:postgres]
command=/usr/lib/postgresql/14/bin/postgres -D /var/lib/postgresql/data -c listen_addresses=*
user=postgres
priority=10
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=redis-server --appendonly yes --dir /data/redis --bind 0.0.0.0 --maxmemory 512mb --maxmemory-policy allkeys-lru
user=redis
priority=10
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:minio]
command=/usr/local/bin/minio server /data/minio --address :9000 --console-address :9001
priority=10
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --------------------------------------------------------------------------
; Application
; --------------------------------------------------------------------------

[program:api]
command=/usr/local/bin/start-api.sh
directory=/app
priority=20
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/usr/local/bin/start-worker.sh
directory=/app
priority=30
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
