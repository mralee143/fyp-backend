services:
  postgres:
    image: postgres:14
    container_name: vision_db_postgres
    environment:
      POSTGRES_DB: vision_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d vision_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
