# Two images, two containers.
#
#   backend    everything server-side in one image: PostgreSQL 14, Redis, MinIO,
#              the FastAPI API, the ARQ worker, and all four detection models
#              baked in. No network needed at run time.
#   frontend   the Next.js UI.
#
#   docker compose up -d --build   build and start both
#   docker compose ps              check health
#   docker compose logs -f backend all five backend processes, one stream
#   docker compose down            stop (data is kept in named volumes)
#   docker compose down -v         stop AND wipe the data
#
# The `postgres`, `redis` and `minio` services further down are the old split
# stack, kept for the venv workflow in RUN.md section B. They sit behind a
# profile, so `docker compose up -d` ignores them — but naming them explicitly
# (`docker compose up -d postgres redis minio`) still works exactly as before.
# Do not run both at once: they publish the same host ports, and the backend
# image mounts the same volumes.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # CPU torch by default. For an NVIDIA GPU use
        #   https://download.pytorch.org/whl/cu126
        # and uncomment the `deploy` block below.
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    # Local name by default; set BACKEND_IMAGE to a Docker Hub repo (see
    # .env.production) and `docker compose push` publishes it.
    image: ${BACKEND_IMAGE:-vision-backend:latest}
    container_name: vision_backend
    restart: unless-stopped
    env_file:
      # Secrets and anything without a safe default: SECRET_KEY, GEMINI_API_KEY,
      # the SMTP block. Both optional so a fresh clone still starts, and
      # .env.production is read last so it wins where the two overlap.
      - path: .env
        required: false
      - path: .env.production
        required: false
    environment:
      # The five processes share this container's network namespace, so the
      # API reaches the database, Redis and MinIO on loopback. These override
      # whatever .env says, since .env holds host-side addresses.
      DATABASE_URL: postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-postgres}@127.0.0.1:5432/${POSTGRES_DB:-vision_db}
      REDIS_URL: redis://127.0.0.1:6379/0
      MINIO_ENDPOINT: 127.0.0.1:9000
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vision_db}
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      # Frames and clips reach the browser as presigned URLs, and a presigned
      # URL signs its own Host header. The browser talks to the published port,
      # so that is the host the signature has to be built against — which on a
      # deployed server is the public address, not localhost. Set
      # MINIO_PUBLIC_ENDPOINT in .env.production to override the local default.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-min-32-characters-long}
    ports:
      - "${API_PORT:-8000}:8000"
      # Host 5434 -> container 5432 (host 5432/5433 are taken by native PostgreSQL 13/18).
      - "${POSTGRES_PORT:-5434}:5432"
      - "${REDIS_PORT:-6379}:6379"
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      # The same volumes the split stack used, mounted at the paths the bundled
      # services expect — so an existing database, object store and job queue
      # carry straight over.
      - postgres_data:/var/lib/postgresql/data
      - minio_data:/data/minio
      - redis_data:/data/redis
      # Incident clips written before object storage, still served from /media.
      - media_data:/app/media
    # GPU (NVIDIA Container Toolkit + a CUDA TORCH_INDEX_URL build):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time: this is the URL the
        # browser calls, so it is a host address, never `http://backend:8000`.
        # Change it and rebuild — a restart alone will not pick it up.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: ${FRONTEND_IMAGE:-vision-frontend:latest}
    container_name: vision_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Split backing services — RUN.md section B (running the API from the venv).
  # Behind a profile so a bare `docker compose up -d` skips them.
  # --------------------------------------------------------------------------

  postgres:
    profiles: ["split"]
    image: postgres:14
    container_name: vision_db_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vision_db}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-vision_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    profiles: ["split"]
    image: minio/minio:latest
    container_name: vision_db_minio
    restart: unless-stopped
    # Object storage for uploaded videos and every extracted frame image.
    # 9000 = S3 API (MINIO_ENDPOINT), 9001 = web console.
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["split"]
    image: redis:7-alpine
    container_name: vision_db_redis
    restart: unless-stopped
    # Broker for the ARQ job queue, cache backend, and pub/sub channel that
    # feeds the SSE progress stream. AOF on so queued jobs survive a restart.
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  redis_data:
  media_data:
